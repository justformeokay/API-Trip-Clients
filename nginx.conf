# ============================================================
# HealingYuk API — Nginx Vhost (aaPanel / Ubuntu)
# Domain  : api-trip.karyadeveloperindonesia.com
# Web root: /www/wwwroot/api-trip.karyadeveloperindonesia.com/public
#
# Cara pakai di aaPanel:
#   Website → pilih domain → Config → tempel isi blok server di bawah
#   (hapus konfigurasi default yang dibuat aaPanel terlebih dahulu)
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api-trip.karyadeveloperindonesia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-trip.karyadeveloperindonesia.com;

    # Root diarahkan ke subfolder /public — WAJIB
    root  /www/wwwroot/api-trip.karyadeveloperindonesia.com/public;
    index index.php;

    # ----------------------------------------------------------
    # SSL — dikelola aaPanel (Let's Encrypt)
    # Aktifkan SSL dulu dari panel, lalu path ini otomatis terisi
    # ----------------------------------------------------------
    ssl_certificate     /www/server/panel/vhost/cert/api-trip.karyadeveloperindonesia.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api-trip.karyadeveloperindonesia.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ----------------------------------------------------------
    # Security headers
    # ----------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"                                         always;
    add_header X-Frame-Options           "DENY"                                            always;
    add_header X-XSS-Protection          "1; mode=block"                                  always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"   always;
    add_header Referrer-Policy           "no-referrer"                                    always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"        always;
    fastcgi_hide_header X-Powered-By;
    more_clear_headers Server X-Powered-By;

    # ----------------------------------------------------------
    # Gzip
    # ----------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_types      application/json text/plain application/javascript text/css;
    gzip_min_length 256;

    # Batas ukuran upload
    client_max_body_size 10M;

    # ----------------------------------------------------------
    # Routing — semua request masuk ke index.php
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ----------------------------------------------------------
    # PHP-FPM
    # aaPanel menyimpan socket PHP di /tmp/php-cgi-{ver}.sock
    # Ganti angka sesuai versi PHP yang diinstall di aaPanel:
    #   PHP 8.1 → unix:/tmp/php-cgi-81.sock
    #   PHP 8.2 → unix:/tmp/php-cgi-82.sock
    # ----------------------------------------------------------
    location ~ \.php$ {
        try_files      $uri =404;
        include        fastcgi_params;
        fastcgi_pass   unix:/tmp/php-cgi-82.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PHP_VALUE       "error_log=/www/wwwlogs/api-trip.karyadeveloperindonesia.com.error.log";
        fastcgi_index  index.php;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # ----------------------------------------------------------
    # Blokir akses ke file sensitif
    # ----------------------------------------------------------
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(env|json|lock|md|sql|sh|log|yaml|yml|xml)$ {
        deny all;
        return 404;
    }

    # Blokir akses langsung ke folder app/bootstrap/config/etc
    location ~* ^/(app|bootstrap|config|database|routes|tests|vendor)/ {
        deny all;
        return 404;
    }

    # ----------------------------------------------------------
    # Cache static assets
    # ----------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2|woff)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ----------------------------------------------------------
    # Logging (aaPanel style)
    # ----------------------------------------------------------
    access_log /www/wwwlogs/api-trip.karyadeveloperindonesia.com.log combined;
    error_log  /www/wwwlogs/api-trip.karyadeveloperindonesia.com.error.log warn;
}
